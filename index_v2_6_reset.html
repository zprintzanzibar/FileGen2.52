<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZPRINT WO Tool – Stable v2.6</title>
<style>
body{font-family:Arial;padding:20px;max-width:560px}
label{display:block;margin-top:12px}
select,input,button{width:100%;padding:8px;margin-top:4px}
button{margin-top:16px}
#result{margin-top:20px}
</style>
</head>
<body>

<h2>ZPRINT – Work Order Generator</h2>

<form id="woForm">
  <label>Category</label>
  <select id="category" required></select>

  <label>Subcategory</label>
  <select id="subcategory" required></select>

  <label>Client Name</label>
  <input id="client" required>

  <label>Client Phone</label>
  <input id="phone" required>

  <label>Description</label>
  <input id="description">

  <label>Version</label>
  <input id="version" value="v0">

  <button type="submit">Generate</button>
</form>

<div id="result" style="display:none">
  <p><b>Generated Filename</b></p>
  <input id="filename" readonly>
  <button type="button" onclick="copyFilename()">COPY</button>
  <p>
    <a id="labelLink" target="_blank">Open Job Card</a>
  </p>
</div>

<script>
/* ===============================
   CATEGORY DEFINITIONS (LOCKED)
================================ */
const CATEGORIES = {
  PVC:{subs:{CLEAR:"Clear",PRC:"Print & Cut",UV:"UV",UVPC:"UV Print & Cut",CUT:"Cutting",PLN:"Plain",GLDC:"Gold Cutting",GLDP:"Gold Plain",ECO:"Eco",CLRPRC:"Clear Print & Cut",FRPL:"Frost Plain",FRCUT:"Frost Cut",FRPRC:"Frost Print & Cut",MAG:"Magnet",RFL:"Reflexive Sticker",HNY:"Honeycomb"}},
  EMB:{subs:{STD:"Standard",PRM:"Premium"}},
  CAN:{subs:{COT:"Cotton",UV:"UV",ECO:"Eco",OTH:"Other"}},
  BAN:{subs:{UV:"UV",ECO:"Eco",TD:"Tear Drop",FECO:"Flag Eco",FUV:"Flag UV",POP:"POP",STD:"Standard",PRM:"Premium",TELSCP:"Telescope"}},
  MAP:{subs:{NRM:"Normal",PP:"PP",POP:"POP"}},
  SUB:{subs:{SUB:"Sublimation"}},
  DTF:{subs:{DTF:"DTF"}},
  CON:{subs:{UV:"UV",ECO:"Eco",PLN:"Plain"}},
  FLT:{subs:{UVD:"UV_DTF",PEN:"Pen",NOTE:"Notebook",ACR:"Acrylic"}},
  PUB:{subs:{FLY:"Flyer",BR:"Brochure",BC:"Business Card",OTH:"Other"}},
  CUS:{subs:{CUS:"Custom Input"}}
};

/* ===============================
   BACKEND URL (LOCKED)
================================ */
const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyPat4Q7LTdv3985ABPYVeMMeEnVUbsFCIBrzhYOmz2EHcr41JFY3W7GA3JM0cslAaN/exec";

/* ===============================
   DROPDOWN POPULATION
================================ */
const category = document.getElementById("category");
const subcategory = document.getElementById("subcategory");

category.innerHTML = "<option value=''>Select Category</option>";
subcategory.innerHTML = "<option value=''>Select Subcategory</option>";

Object.keys(CATEGORIES).forEach(c => {
  const o = document.createElement("option");
  o.value = c;
  o.textContent = c;
  category.appendChild(o);
});

category.onchange = () => {
  subcategory.innerHTML = "<option value=''>Select Subcategory</option>";
  const subs = CATEGORIES[category.value]?.subs || {};
  Object.keys(subs).forEach(s => {
    const o = document.createElement("option");
    o.value = s;
    o.textContent = `${s} - ${subs[s]}`;
    subcategory.appendChild(o);
  });
};

/* ===============================
   SUBMIT HANDLER
================================ */
document.getElementById("woForm").onsubmit = async e => {
  e.preventDefault();

  const params = new URLSearchParams({
    action: "createWO",
    category: category.value,
    subcategory: subcategory.value,
    client: client.value,
    phone: phone.value,
    description: description.value,
    version: version.value || "v0"
  });

  try {
    const res = await fetch(`${SCRIPT_URL}?${params}`);
    const data = await res.json();

    if (!data.wo || !data.date) {
      alert("Backend did not return WO or date");
      return;
    }

    /* ===============================
       FINAL FILENAME CONSTRUCTION
       (NUMERIC WO – NO PARSING)
    ================================ */

    const woNum = data.wo;        // "001"
    const dateISO = data.date;    // "2025-12-28"

    const [yyyy, mm, dd] = dateISO.split("-");
    const shortDate = `${dd}${mm}${yyyy.slice(-2)}`;

    const clientName = client.value
      .trim()
      .replace(/\s+/g, "")
      .replace(/[^a-zA-Z0-9_-]/g, "");

    const desc = description.value
      .trim()
      .replace(/\s+/g, "")
      .replace(/[^a-zA-Z0-9_-]/g, "");

    const finalFilename =
      `WO${woNum}_${shortDate}_${category.value}-${subcategory.value}_${clientName}_${desc}_v0`;

    document.getElementById("filename").value = finalFilename;
    document.getElementById("labelLink").href =
      `${SCRIPT_URL}?action=printSingle&wo=${encodeURIComponent(woNum)}`;

    document.getElementById("result").style.display = "block";

  } catch (err) {
    alert("Connection error. Check Apps Script deployment.");
  }
};

function copyFilename() {
  const f = document.getElementById("filename");
  f.select();
  f.setSelectionRange(0, 99999);
  document.execCommand("copy");
}
</script>

</body>
</html>
